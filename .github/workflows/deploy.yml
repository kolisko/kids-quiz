name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  KIDS_QUIZ_HEALTHCHECK_DOMAIN: beatka.eu

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "sha=${image_name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${image_name}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build Angular and Kotlin Docker context
        run: ./gradlew stageDockerImageContext --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/deploy/image-context
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.latest }}

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "${VPS_HOST}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/kids_quiz_vps
          chmod 600 ~/.ssh/kids_quiz_vps
          printf '%s %s\n' \
            "${VPS_HOST}" \
            'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJVxH5H497HTzA6OhHjE62EZ750q9yAa00SmvgTyPMNt' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts | awk 'NR == 1 { print $2 }')" = \
            'SHA256:CJnOawg534j3npV2l603M7FFHvE4uu0aE3TfXOIw7QQ'

      - name: Deploy on VPS
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/kids_quiz_vps \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "deploy-kids-quiz@${{ secrets.VPS_HOST }}" \
            "deploy ${GITHUB_SHA}"

      - name: Healthcheck
        shell: bash
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors \
            "https://${KIDS_QUIZ_HEALTHCHECK_DOMAIN}/api/health"
