site:
  title: "Kids Quiz"

server:
  port: 8080
  cors:
    hosts:
      - name: "beatka.duckdns.org"
        schemes:
          - "https"
      - name: "localhost:8080"
        schemes:
          - "http"
      - name: "127.0.0.1:8080"
        schemes:
          - "http"
      - name: "docker.localhost:18080"
        schemes:
          - "http"
      - name: "clean-docker.localhost:18080"
        schemes:
          - "http"
  files:
    dev:
      contentRoot: "build/processedResources/js/main/public"
      script: "build/kotlin-webpack/js/developmentExecutable/com-example-quiz.js"
      api: "build/libs/site-jvm-1.0-SNAPSHOT.jar"
    prod:
      script: "build/dist/js/productionExecutable/com-example-quiz.js"
      siteRoot: ".kobweb/site"
