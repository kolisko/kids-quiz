services:
  app:
    image: ${KIDS_QUIZ_IMAGE:-kids-quiz:latest}
    restart: unless-stopped
    environment:
      KIDS_QUIZ_DATA_DIR: /data
      KIDS_QUIZ_DB_PATH: /data/kids-quiz.sqlite
      KIDS_QUIZ_STATIC_DIR: /app/public
      KIDS_QUIZ_PASSWORD_HASH: ${KIDS_QUIZ_PASSWORD_HASH:-}
      KIDS_QUIZ_AUTH_COOKIE_SECURE: ${KIDS_QUIZ_AUTH_COOKIE_SECURE:-true}
    volumes:
      - /opt/kids-quiz/data:/data
    expose:
      - "8080"
    networks:
      public-proxy:
        aliases:
          - beatka-app

networks:
  public-proxy:
    external: true
