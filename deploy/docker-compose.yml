services:
  app:
    image: ${KIDS_QUIZ_IMAGE:-kids-quiz:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KIDS_QUIZ_DATA_DIR: /data
      KIDS_QUIZ_DB_PATH: /data/kids-quiz.sqlite
      KIDS_QUIZ_STATIC_DIR: /app/public
      KIDS_QUIZ_PASSWORD_HASH: ${KIDS_QUIZ_PASSWORD_HASH:-}
      KIDS_QUIZ_AUTH_COOKIE_SECURE: ${KIDS_QUIZ_AUTH_COOKIE_SECURE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-marin}
      OPENAI_TTS_INSTRUCTIONS: ${OPENAI_TTS_INSTRUCTIONS:-Pronounce this single English spelling word clearly in American English. Say only the word.}
      OPENAI_SPELLING_TTS_INSTRUCTIONS: ${OPENAI_SPELLING_TTS_INSTRUCTIONS:-Spell this English word clearly one letter at a time. Say only the letters.}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1024x1024}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-low}
      OPENAI_IMAGE_FORMAT: ${OPENAI_IMAGE_FORMAT:-jpeg}
      OPENAI_FLIPCARD_IMAGE_PROMPT: ${OPENAI_FLIPCARD_IMAGE_PROMPT:-Create a bright, friendly, child-safe flashcard picture for the English word %s. Show one clear object or simple scene, no text, no letters, no watermark, centered subject, colorful educational style.}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-4.1-mini}
      FLIPCARD_IMAGE_WORKERS: ${FLIPCARD_IMAGE_WORKERS:-1}
      SPELLING_AUDIO_WORKERS: ${SPELLING_AUDIO_WORKERS:-2}
      FLIPCARD_TRANSLATION_WORKERS: ${FLIPCARD_TRANSLATION_WORKERS:-1}
    volumes:
      - /opt/kids-quiz/data:/data
    expose:
      - "8080"
    networks:
      public-proxy:
        aliases:
          - beatka-app

networks:
  public-proxy:
    external: true
