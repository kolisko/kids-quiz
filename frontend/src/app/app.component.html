<div class="app-shell">
  <header class="shell-header">
    <a class="brand-link" routerLink="/home" aria-label="Domů">
      <lucide-icon [img]="homeIcon" [size]="24"></lucide-icon>
      <span>Kids Quiz</span>
    </a>
    <nav class="shell-nav" aria-label="Hlavní navigace">
      <button class="shell-icon-button" type="button" [title]="themeLabel" [attr.aria-label]="themeLabel" (click)="toggleTheme()">
        <lucide-icon [img]="themeIcon" [size]="26"></lucide-icon>
      </button>
      <a routerLink="/settings" title="Nastavení" aria-label="Nastavení">
        <lucide-icon [img]="settingsIcon" [size]="26"></lucide-icon>
      </a>
      <a routerLink="/assets" title="Asset library" aria-label="Asset library">
        <lucide-icon [img]="libraryIcon" [size]="26"></lucide-icon>
      </a>
      <a routerLink="/trophies" title="Trofeje" aria-label="Trofeje">
        <lucide-icon [img]="trophyIcon" [size]="26"></lucide-icon>
      </a>
    </nav>
  </header>
  <main class="shell-main">
    <router-outlet></router-outlet>
  </main>
</div>
